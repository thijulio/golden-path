<div class="shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/">
      <span class="brand-mark">GP</span>
      <span>Golden Path</span>
    </a>
    <nav class="nav">
      @for (group of navGroups; track group.title) {
        <div class="nav-group">
          <div class="nav-group-title">{{ group.title }}</div>
          @for (item of group.items; track item.path) {
            <a class="nav-item"
               [routerLink]="item.path"
               routerLinkActive="active"
               [routerLinkActiveOptions]="{ exact: item.path === '/' }">
              {{ item.label }}
            </a>
          }
        </div>
      }
    </nav>
    <div class="sidebar-foot">
      <span class="foot-dot"></span> decision layer · <code>@thijulio</code>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="crumb">Golden Path / Stack &amp; Architecture</span>
      <span class="version">v2 · Angular 22</span>
    </header>
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
